############## BASIC PROJECT INFO ##############
sonar.projectKey=it-helpdesk
sonar.projectName=IT Helpdesk
sonar.projectVersion=1.0

############## SOURCE CODE SETUP ##############
sonar.sources=app,resources/js

sonar.exclusions=\
vendor/**,\
node_modules/**,\
public/**,\
storage/**,\
bootstrap/**,\
resources/js/**/*.spec.js,\
resources/js/**/*.test.js

sonar.inclusions=resources/js/**/*.vue,resources/js/**/*.js,app/**/*.php

############## PHP SETTINGS (Laravel) ##############
sonar.language=php
sonar.php.file.suffixes=.php

sonar.php.coverage.reportPaths=coverage.xml

sonar.coverage.exclusions=\
routes/**,\
database/**,\
config/**,\
app/Console/Kernel.php,\
resources/js/**

############## JAVASCRIPT / TYPESCRIPT SETTINGS (Vue) ##############
sonar.javascript.file.suffixes=.js,.vue
sonar.typescript.tsconfigPaths=resources/ts/tsconfig.json,resources/js/tsconfig.json

sonar.javascript.lcov.reportPaths=coverage/lcov.info

############## CODE SMELL & DUPLICATION TUNING ##############
sonar.sourcesEncoding=UTF-8
